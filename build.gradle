plugins {
    id "application"
    id "org.gradlex.extra-java-module-info" version "1.11"
}

repositories {
    mavenCentral()
}

dependencies {
    implementation files("../vineflower/build/libs/vineflower-1.11.2.jar")
    implementation "org.json:json:20250107"
    implementation "info.picocli:picocli:4.7.6"
    implementation "org.jetbrains:annotations:26.0.2"
    implementation "org.ow2.asm:asm:9.8"
    implementation "org.ow2.asm:asm-tree:9.8"
    implementation "org.ow2.asm:asm-util:9.8"
    implementation "org.snakeyaml:snakeyaml-engine:2.10"
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

extraJavaModuleInfo {
    module("org.vineflower:vineflower", "vineflower") {
        exportAllPackages()
        uses("org.jetbrains.java.decompiler.api.plugin.Plugin")
    }
    automaticModule("vineflower-1.11.2.jar", "vineflower")
}

application {
    mainModule = "com.github.zomboiddecompiler"
    mainClass = "com.github.zomboiddecompiler.commands.Decompile"
}

tasks.register('verifyBytecode', JavaExec) {
    description = "Compare original bytecode against recompiled classes"
    group = "verification"
    classpath = sourceSets.main.runtimeClasspath
    mainModule = "com.github.zomboiddecompiler"
    mainClass = "com.github.zomboiddecompiler.commands.Verify"
    // Exit code 2 = mismatches found (not a build failure)
    ignoreExitValue = true
}